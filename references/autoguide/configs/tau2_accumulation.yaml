benchmark: tau2
experiment_name: tau2
tau2:
  task_split: train
  solver_mode: conversational
  max_steps: 200
accumulation:
  max_failures: 4
  num_success_to_continue: 1
  extraction_model: gpt-5.4
run:
  parallel: 20
kind: accumulation
autoguide:
  context_model: gpt-5.4  # DEVIATION: AutoGuide runs context identification on the agent model

# Paper: Table 1, reasoningbank (tau2), rerun with gpt-5.4 for every auxiliary role (paper Section 4).
# Rebuilt from the launch config (tau2_accumulation_gpt54aux.yaml); it matches the run snapshot.
# Output: outputs/baselines/reasoningbank/memory/tau2/
benchmark: tau2
experiment_name: tau2
tau2:
  task_split: train
  solver_mode: conversational
  max_steps: 200
accumulation:
  max_failures: 1
  num_success_to_continue: 1
  extraction_reasoning_effort: high
run:
  parallel: 5
kind: accumulation
reasoningbank:
  bank_path: outputs/baselines/reasoningbank/memory/tau2/pool.json
  extraction_model: gpt-5.4  # DEVIATION: ReasoningBank's extractor is the agent model
  judge_model: gpt-5.4       # DEVIATION: ReasoningBank's judge is the agent model

# Builds the blog post (blogpost/) and publishes it on GitHub Pages, at
# https://illuin-tech.github.io/daedalus/. Needs Settings → Pages → Source: "GitHub Actions".
name: blog
on:
  push:
    branches: [main]
    paths: ["blogpost/**", ".github/workflows/blog.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blogpost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: blogpost/.nvmrc
          cache: npm
          cache-dependency-path: blogpost/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blogpost/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
